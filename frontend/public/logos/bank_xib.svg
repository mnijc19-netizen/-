<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" rx="220" fill="#004098" />
  <g transform="translate(512, 440)">
    <!-- Lucky Clover / Four-Leaf Cross (幸运四叶草) -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="#FFFFFF" stroke-width="40"/>
    <!-- Four rounded clover petals -->
    <rect x="-140" y="-140" width="130" height="130" rx="65" fill="#E60012"/>
    <rect x="10" y="-140" width="130" height="130" rx="65" fill="#FDB813"/>
    <rect x="-140" y="10" width="130" height="130" rx="65" fill="#FDB813"/>
    <rect x="10" y="10" width="130" height="130" rx="65" fill="#E60012"/>
    <circle cx="0" cy="0" r="35" fill="#FFFFFF"/>
  </g>
  <text x="512" y="870" fill="#FFFFFF" font-size="70" font-weight="900" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">厦门国际银行</text>
</svg>